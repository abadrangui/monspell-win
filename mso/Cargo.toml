[package]
name = "monspell-mso"
description = "Office Custom Proofing Tool (CSAPI) shim for monspell: real per-word spell-check + suggestions via monspell-core."
version = "0.2.0-beta"
authors = ["abadrangui <abadrangui@gmail.com>"]
license = "GPL-3.0"
edition = "2021"

# Standalone crate: without this, cargo adopts any enclosing workspace —
# monspell's CI clones this fork inside the monspell checkout and the build
# fails with "current package believes it's in a workspace".
[workspace]

[dependencies]
# Private repo for now: CI patches this to a local checkout via --config
# 'patch."https://github.com/abadrangui/monspell".monspell-core.path=...'
monspell-core = { git = "https://github.com/abadrangui/monspell", branch = "main" }

[lib]
name = "monspell_mso"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
